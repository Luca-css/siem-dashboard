[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "siem-dashboard"
version = "3.0.0"
description = "Real-time mini-SIEM: ingests Windows Security / syslog events, runs YAML detection rules and streams alerts over WebSocket."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Lucas Santos" }]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "PyYAML>=6.0",
    "tzdata>=2024.1", # IANA time zones for zoneinfo on Windows / slim images
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "httpx2>=2.0",  # used by starlette.testclient (newer Starlette)
    "httpx>=0.27",  # fallback for older Starlette releases
    "ruff>=0.6",
    "mypy>=1.10",
    "types-PyYAML",
]

[project.scripts]
siem = "siem.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/siem"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
source = ["siem"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "S", "C4", "RUF"]
ignore = [
    "S101", # assert is fine in tests
]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["S311"] # random is fine for generating demo traffic
"tests/*" = ["S311"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
packages = ["siem"]
